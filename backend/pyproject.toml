[project]
name = "ai-document-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "structlog",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "redis",
    "celery",
    "boto3",
    "python-multipart>=0.0.33",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "pytesseract>=0.3.13",
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "charset-normalizer>=3.4.0",
    "langchain-core",
    "langchain-google-genai",
    "rapidfuzz",
    "dateparser",
    "pycountry",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "mypy",
    "boto3-stubs[s3]",
    "reportlab>=5.1.0",
    "xlwt>=1.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Slow benchmarks only run on request: `make bench` (pytest -m slow).
addopts = '-m "not slow"'
markers = ["slow: large-document benchmarks, run with make bench"]

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*", "openpyxl.*", "pypdfium2.*", "reportlab.*", "pytesseract.*", "xlrd.*", "xlwt.*", "dateparser.*", "pycountry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
